<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">

    <title>Crop Recommendation System</title>
    <style>
      body {
        background: linear-gradient(135deg, #e8f5e9 0%, #ffffff 100%);
        min-height: 100vh;
      }
      .navbar {
        background: #1b5e20;
      }
      .page-title {
        color: #1b5e20;
        font-weight: 700;
      }
      .card-predict {
        border: none;
        border-radius: 24px;
        box-shadow: 0 20px 50px rgba(14, 30, 37, 0.12);
      }
      .form-label {
        font-weight: 600;
        color: #2e7d32;
      }
      .form-control {
        border-radius: 12px;
        border: 1px solid #c8e6c9;
      }
      .btn-primary {
        background: #1b5e20;
        border: none;
        border-radius: 12px;
        padding: 12px 24px;
      }
      .helper-text {
        color: #4e4e4e;
      }
      .info-box {
        background: rgba(27, 94, 32, 0.08);
        border-radius: 16px;
        padding: 18px 20px;
        margin-bottom: 1rem;
      }
      .form-section {
        padding: 32px;
      }
      .image-panel {
        border-top-left-radius: 24px;
        border-bottom-left-radius: 24px;
        overflow: hidden;
      }
      .image-panel img {
        object-fit: cover;
        height: 100%;
        width: 100%;
      }
      @media (max-width: 991px) {
        .image-panel {
          border-radius: 24px 24px 0 0;
        }
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark">
      <div class="container">
        <a class="navbar-brand" href="/">Crop Recommendation</a>
      </div>
    </nav>

    <div class="container py-5">
      <div class="card card-predict mx-auto">
        <div class="row g-0">
          <div class="col-lg-5 image-panel d-none d-lg-block">
            <img src="/static/images/pexels-pixabay-207247 (1).jpg" alt="Crop" />
          </div>
          <div class="col-lg-7">
            <div class="form-section">
              <h1 class="page-title">Get Crop Recommendation</h1>
              <p class="helper-text">Enter the soil and weather values below to predict the most suitable crop for your farm.</p>

              <div class="info-box">
                <p class="mb-0"><strong>Tip:</strong> Use actual soil test values when available for best results.</p>
              </div>

              {% if error %}
              <div class="alert alert-danger" role="alert">
                {{ error }}
              </div>
              {% endif %}

              <form action="/success" method="post">
                <div class="row g-3">
                  <div class="col-md-6">
                    <label class="form-label">Nitrogen (N)</label>
                    <input type="number" class="form-control" name="nitrogen" required placeholder="e.g. 90" />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Phosphorous (P)</label>
                    <input type="number" class="form-control" name="phosphorous" required placeholder="e.g. 40" />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Potassium (K)</label>
                    <input type="number" class="form-control" name="potasium" required placeholder="e.g. 40" />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">pH Value</label>
                    <input type="number" step="0.1" class="form-control" name="ph" required placeholder="e.g. 6.5" />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Temperature (°C)</label>
                    <input type="number" step="0.1" class="form-control" name="temprature" required placeholder="e.g. 30" />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Moisture (%)</label>
                    <input type="number" step="0.1" class="form-control" name="moisture" required placeholder="e.g. 60" />
                  </div>
                  <div class="col-12">
                    <label class="form-label">Rainfall (mm)</label>
                    <input type="number" step="0.1" class="form-control" name="rainfall" required placeholder="e.g. 150" />
                  </div>
                </div>

                <div class="d-grid mt-4">
                  <button type="submit" class="btn btn-primary btn-lg">Predict Crop</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
  </body>
</html>
